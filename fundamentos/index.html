<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    `

    <style>
      .galeria {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 0 auto;
        max-width: 80%;
      }

      .galeria div {
        text-align: center;
      }

      img {
        display: block;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">Galería de Imágenes</h1>

    <div style="text-align: center; margin-bottom: 20px">
      <input type="text" id="imagenURL" placeholder="URL de la imagen" />
      <input type="text" id="pieFoto" placeholder="Pie de foto" />
      <button onclick="agregaImage()">Agregar</button>
    </div>

    <div class="galeria" id="galeriaImagenes">
      <div>
        <img src="img/img1.jpg" alt="Imagen 1" width="300" height="250" />
        <p>Pie de foto Imagen 1</p>
      </div>

      <div>
        <img src="img/img2.jpg" alt="Imagen 2" width="300" height="250" />
        <p>Pie de foto Imagen 2</p>
      </div>

      <div>
        <img src="img/img3.jpg" alt="Imagen 3" width="300" height="250" />
        <p>Pie de foto Imagen 3</p>
      </div>

      <div>
        <img src="img/img4.jpg" alt="Imagen 4" width="300" height="250" />
        <p>Pie de foto Imagen 4</p>
      </div>
    </div>

    <script>
      function agregaImage() {
        // Detectar elementos
        var url = document.getElementById("imagenURL").value;
        var pie = document.getElementById("pieFoto").value;
        var galeria = document.getElementById("galeriaImagenes");

        // Comprobar que si hay valores
        if (url && pie) {
          var div = document.createElement("div");
          var img = document.createElement("img");
          var p = document.createElement("p");

          // Asignar valores
          img.src = url;
          img.width = 300;
          img.height = 250;
          p.textContent = pie;

          // Agregar elemento
          div.appendChild(img);
          div.appendChild(p);
          galeria.appendChild(div);

          // Borrar campos
          document.getElementById("imagenURL").value = "";
          document.getElementById("pieFoto").value = "";
        } else alert("Agrega una imagen y pie");
      }
    </script>
  </body>
</html>
